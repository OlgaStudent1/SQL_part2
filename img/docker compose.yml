services:
  shard_1:
    image: postgres:14
    container_name: shard_1
    environment:
      POSTGRES_USER: sharduser
      POSTGRES_PASSWORD: shardpass
      POSTGRES_DB: library_db
    ports:
      - "5433:5432"
    volumes:
      - shard1_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - sharding_net

  shard_2:
    image: postgres:14
    container_name: shard_2
    environment:
      POSTGRES_USER: sharduser
      POSTGRES_PASSWORD: shardpass
      POSTGRES_DB: library_db
    ports:
      - "5434:5432"
    volumes:
      - shard2_data:/var/lib/postgresql/data
    networks:
      - sharding_net

volumes:
  shard1_data:
  shard2_data:

networks:
  sharding_net:
    driver: bridge
